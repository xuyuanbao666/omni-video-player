name: omni_player
description: A privacy-first cross-platform video player.
publish_to: none
version: 0.4.0+5
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_selector: ^1.1.0
  shared_preferences: 2.5.3
  share_plus: 10.1.4
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
