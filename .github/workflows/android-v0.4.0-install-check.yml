name: Android v0.4.0 installation diagnostics and fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-v0.4.0-install-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-v040-install-check
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact published APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir original
          gh release download v0.4.0 --repo "$GITHUB_REPOSITORY" --dir original --pattern '*.apk' --pattern SHA256SUMS.txt
          cd original
          grep '\.apk$' SHA256SUMS.txt | sha256sum --check --strict
      - name: Check Android signing, manifest and alignment
        shell: bash
        run: |
          set -uo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;36.0.0' || exit 1; fi
          status=0
          for apk in original/*.apk; do
            echo "::group::$apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" || status=1
            "$tools/aapt2" dump badging "$apk" || status=1
            "$tools/zipalign" -c -v 4 "$apk" >/dev/null || status=1
            if ! "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null; then
              echo "::warning::16 KiB ZIP alignment check failed for $apk"
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Enable KVM
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install original x86_64 APK on Android emulator
        if: always()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb install original/OmniPlayer-Android-x86_64-test.apk
  universal:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f587e23daa6d421940e5bb8e80d60e4ab0c2eae4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: python3 scripts/bootstrap.py --platform android
      - name: Build standalone universal APK from tested source
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/OmniPlayer-Android-universal-test.apk
      - name: Verify universal APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then sdkmanager 'build-tools;36.0.0'; fi
          apk=dist/OmniPlayer-Android-universal-test.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" | tee badging.txt
          grep -q "'arm64-v8a'" badging.txt
          grep -q "'x86_64'" badging.txt
          grep -q "'armeabi-v7a'" badging.txt
          "$tools/zipalign" -c -v 4 "$apk" >/dev/null
          if ! "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null; then
            echo "::warning::16 KiB ZIP alignment check failed"
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS-Android-universal.txt
          sha256sum --check --strict SHA256SUMS-Android-universal.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write single-shell smoke test
        shell: bash
        run: |
          cat > android_install_smoke.sh <<'SMOKE'
          set -euo pipefail
          apk="${1:?APK required}"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$("$tools/aapt2" dump badging "$apk")"
          pkg="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          test "$pkg" = 'com.omniplayer.app.omni_player'
          adb logcat -c
          adb install "$apk"
          adb shell pm path "$pkg"
          adb shell am start -W -n "$pkg/.MainActivity"
          sleep 15
          if ! adb shell pidof "$pkg"; then
            adb logcat -d -t 800
            exit 1
          fi
          adb shell dumpsys activity activities | grep -F "$pkg" || true
          echo "Installed and process running: $pkg"
          SMOKE
      - name: Install and launch universal APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android_install_smoke.sh dist/OmniPlayer-Android-universal-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-universal-verified-v0.4.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  publish-fallback:
    needs: universal
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-universal-verified-v0.4.0
          path: dist
      - name: Add verified alternative without replacing existing files
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check --strict SHA256SUMS-Android-universal.txt)
          gh release upload v0.4.0 dist/OmniPlayer-Android-universal-test.apk dist/SHA256SUMS-Android-universal.txt --repo "$GITHUB_REPOSITORY"
